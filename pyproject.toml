[project]
name = "idea-collider"
version = "0.1.0"
description = "Constraint-intersection product discovery with a small fine-tuned local model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.49",
    "peft>=0.14",
    "accelerate>=1.3",
    "datasets>=3.3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs the fine-tuned model on disk"]

[project.urls]
Homepage = "https://github.com/MYTPONS/idea-collider"
